name: Release

# The release: a tag is cut only after the CI workflow — the fleet's
# gate (greatliontech/actions go-gate.yml) — succeeded on the pushed
# commit. The rules that keep the tag on the judged commit are the
# called workflow's (go-release.yml states them); this caller supplies
# the trigger, the serializing group (one running and one pending run;
# a third arrival cancels the pending one — fail-safe: no wrong tag is
# cut), the releaser app's secret and the write permission.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: greatliontech/actions/.github/workflows/go-release.yml@main
    permissions:
      contents: write
    secrets: inherit

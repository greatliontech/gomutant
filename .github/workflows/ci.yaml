name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Successive PR pushes supersede (per-ref group, cancelled on the next
# push). Main is keyed per-SHA so no two main runs ever share a group:
# by default GitHub cancels a group's PENDING member (cancel-in-progress
# governs only the running one), so a shared main group would leave
# rapid-push intermediate commits verdictless — and every main commit's
# verdict is what release.yaml waits for before it tags that commit.
# Per-SHA grouping removes the collision structurally while keeping a
# concurrency stanza PRs can reuse.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

# This workflow IS the release gate: release.yaml cuts a tag only after
# every job of the fleet's gate (greatliontech/actions go-gate.yml: the
# plain and records tiers here) succeeded on the pushed commit. The
# inputs are this repository's own facts:
#
# go-version pins the stock release the pinned gofresh's toolchain
# audit lists (its go1.27.1 chain row) — never `stable`, which would
# make a commit's releasability a function of Go's release calendar;
# a point release that moves the audited bytes reds the next-stable
# leg (next.yaml) first, and the listing lands in gofresh before the
# pin moves. go.mod's `go 1.27.0` is a minimum, not a pin.
#
# The fast tier is a BARE `go test` (short-args empty, never the
# gate's literal -short): every test that spawns go test, loads the
# fixture tree, or measured heavy is -short-gated, and under the
# default build selection every gate-carrying suite runs as -short
# unless told otherwise (internal/integrationtest) — a package's
# default test binary is its unit suite, the oracle gomutant's own
# campaigns derive — and the bare run is the one in which each suite
# PINS that it took the default (a literal -short makes those pins
# vacuous; an explicitly empty string reaches the called step as
# empty, never as the input's default — the runner's behaviour,
# actions/runner#2907). Measured 2026-09-02 on the 24-core dev host,
# warm: seconds. pre-full runs the `integration` selection's own cells
# (internal/integrationtest: the tag lifts the default; the tag
# constrains no standard-library file, so gofresh admits the selection
# by content on a listed toolchain —
# REQ-closure-observability-toolchain-key). full-args asks for every
# test by the flag, on the default selection.
#
# full-timeout: -timeout bounds one test binary, so the binding figure
# is the slowest package — the root, 1714.5s (28m35s) in the last green
# gate run before this edit (37688646357, 2026-10-07, the 4-vCPU
# runner); 60m holds ~2x. The whole test job (the fast tier, the
# integrationtest leg and the full tier) took 30m01s there, so the
# job's 90m holds ~3x; a cold cache lands on the job ceiling, not this
# flag. An overrun is a real finding — re-measure before raising the
# number.
#
# pre: the platform vet — gofresh's unix-tagged sources once read a
# stat field darwin, freebsd and netbsd spell differently (Ctimespec)
# and the dependency did not build there at the pin; the loop vets
# those three, openbsd and windows (gofresh's own gate's shape) and
# plan9, a GOOS reaching the engine's !unix && !windows process arm
# (js/wasm and wasip1/wasm reach it too), so each platform arm of the
# tree stays visible on every push.
#
# race: off — the policy's one invocation is plain_witness
# (.stipulator/policy.textproto: the standing no-race rule), so no race
# tier runs here and no budget is passed; the gate refuses a race tier
# without one.

jobs:
  gate:
    uses: greatliontech/actions/.github/workflows/go-gate.yml@main
    with:
      go-version: "1.27.1"
      pre: |
        for os in darwin freebsd netbsd openbsd windows plan9; do GOOS=$os go vet -tags integration ./...; done
      vet-tags: integration
      short: true
      short-args: ""
      short-timeout: 5m
      pre-full: go test -tags integration ./internal/integrationtest -count=1
      full-args: -short=false
      full-timeout: 60m
      test-job-minutes: 90
      race: false
      records: true
      # The records tier reads this tree's bindings with the release that
      # writes them — the fleet's current stipulator; a reader behind the
      # writer could refuse a record form it predates.
      stipulator-version: v0.73.4
